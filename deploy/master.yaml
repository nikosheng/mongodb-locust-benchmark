apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark
  namespace: mongo-bench
  # Grant this Kubernetes identity object-write access to your GCS results bucket.
---
apiVersion: v1
kind: Service
metadata:
  name: locust-master
  namespace: mongo-bench
spec:
  selector: {app: locust-master}
  ports:
    - {name: workers, port: 5557, targetPort: 5557}
    - {name: ui, port: 8089, targetPort: 8089}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: locust-master
  namespace: mongo-bench
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app: locust-master}
    spec:
      restartPolicy: Never
      serviceAccountName: benchmark
      terminationGracePeriodSeconds: 90
      containers:
        - name: master
          image: REGION-docker.pkg.dev/PROJECT/bench/mongo-locust:latest
          command: [python, -m, benchmark.artifacts, --]
          args:
            - locust
            - -f
            - locustfile.py
            - --master
            - --headless
            - --expect-workers
            - '4'
            - --expect-workers-max-wait
            - '600'
            - -u
            - '100'
            - -r
            - '20'
            - --run-time
            - 20m
            - --stop-timeout
            - '30'
            - --csv
            - /results/locust
            - --csv-full-history
            - --html
            - /results/locust.html
          env:
            - {name: BENCH_CONFIG, value: /config/benchmark.yaml}
            - {name: BENCH_RUN_ID, value: replace-with-unique-run-id}
            - {name: BENCH_GCS_PREFIX, value: 'gs://REPLACE_BUCKET/replace-with-unique-run-id'}
          resources:
            requests: {cpu: '1', memory: 2Gi, ephemeral-storage: 1Gi}
            limits: {cpu: '1', memory: 2Gi, ephemeral-storage: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: benchmark-config}
